name: CI

on:
  push:
    branches: [main, 'fondasi/**']
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Periksa dependensi Go
        run: go mod verify
      - name: Uji Go
        run: go test ./...
      - name: Periksa Go
        run: go vet ./...
      - name: Pasang dan bangun UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm exec -- svelte-kit sync
          npm run build
          npm run check
      - name: Verifikasi UI tertanam
        run: test -f internal/ui/dist/index.html && test "$(find internal/ui/dist -type f | wc -l)" -gt 0
      - name: Bangun program
        run: go build -trimpath -ldflags='-s -w' -o buku-catatan ./cmd/buku-catatan
      - name: Periksa ukuran
        run: |
          raw_bytes=$(stat -c%s buku-catatan)
          echo "Ukuran biner: $raw_bytes bytes"
          test "$raw_bytes" -lt 52428800
          if [ "$raw_bytes" -ge 31457280 ]; then echo '::warning::Ukuran biner melewati 30 MiB.'; fi

          gzip -9 -c buku-catatan > buku-catatan.gz
          gzip_bytes=$(stat -c%s buku-catatan.gz)
          echo "Ukuran gzip: $gzip_bytes bytes"
          test "$gzip_bytes" -lt 52428800
          if [ "$gzip_bytes" -ge 31457280 ]; then echo '::warning::Ukuran gzip melewati 30 MiB.'; fi
