<!doctype html>
<html lang="id">

    <meta name="theme-color" content="#f7f8fa" />
    <link rel="stylesheet" href="/ui.css" />
    <style>
      .aplikasi.tanpa-buku .panel-navigasi { display: none; }
      .tombol-lipat-buku {
        position: fixed;
        top: 22px;
        left: 214px;
        right: auto;
        z-index: 20;
      }

        .tombol-lipat-buku {

        }
      }
